name: Daily AI Tools Auto-Crawler

on:
  schedule:
    # Runs every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🤖 Run Aoogle Auto-Crawler
        run: node scripts/fetch-new-tools.js

      - name: 🚀 Commit and push if new tools were discovered
        run: |
          if [[ -n $(git status --porcelain src/data/tools.js) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/tools.js
            git commit -m "chore(auto-crawler): index new AI tools [skip ci]"
            git push
            echo "🎉 New AI tools committed and pushed to GitHub!"
          else
            echo "✅ No new tools found today. Everything is up to date."
          fi
